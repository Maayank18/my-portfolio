<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ── -->
    <title>Mayank Garg — Full Stack & AI Developer</title>
    <meta name="description"
      content="Mayank Garg — Full Stack Developer & AI/GenAI Engineer. MERN stack, Deep Learning, open to internships and freelance." />
    <meta name="keywords"
      content="Mayank Garg, Full Stack Developer, React, Node.js, AI, GenAI, MERN, portfolio" />
    <meta name="author" content="Mayank Garg" />

    <!-- ── Open Graph (looks good when shared on LinkedIn/WhatsApp) ── -->
    <meta property="og:title"       content="Mayank Garg — Full Stack & AI Developer" />
    <meta property="og:description" content="MERN Stack · GenAI · Open to internships & freelance" />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://mayankgarg.dev" />

    <!-- ── Theme colour (browser tab colour on mobile) ── -->
    <meta name="theme-color" content="#040406" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      ── Fonts — preconnect first so DNS resolves instantly,
         then load only the weights we actually use.
         display=swap means text shows immediately in fallback font
         while the custom font loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Vite entry point.
      type="module" here is correct — this is the HTML script tag, not package.json.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
